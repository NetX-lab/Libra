# Shared production-scale training configuration for the strict EHP A/B test.
# The two experiment arms inherit this file and may differ only in the EHP
# runtime controls plus non-semantic run labels.
base_config: r2e_gym_qwen3_14b_mcore_gpu_6node48_100step_no_ehp.yaml

# 32 trajectories = 8 prompts x 4 GRPO samples per optimizer step. With DP=4,
# every replica receives 8 trajectories (two complete prompt groups).
batch_size: 32
micro_batch_size: 1
n_samples: 4
total_steps: 200
learning_rate: 1.0e-6
ppo_epochs: 1
kl_coef: 0.001
clip_epsilon: 0.2
gamma: 1.0
seed: 42

# Keep rollout weights substantially fresher than the validation run's
# 25-step cadence while amortizing the current checkpoint/restart sync path.
sync_interval: 5
save_interval: 50

# Inline 30K-token evaluation is deliberately excluded from throughput timing.
# Evaluate the saved step-0/50/.../200 checkpoints with the same held-out set.
eval_interval: 0

max_concurrent_rollouts: 16
max_head_offpolicyness: 4
queue_size: 128

wandb_run_name: "r2e-gym-qwen3-14b-mcore-gpu-6node48-production"
history_experiment_name: "r2e_gym_qwen3_14b_6node48_production"

global_resource_planner:
  # GRP owns the initial 48-GPU partition.  Both stage sizes remain node/DP
  # replica aligned, but neither is pinned to the historical 32/16 split.
  initial_allocation_strategy: "grp"
  fixed_train_gpus: 0
  allocation_granularity_gpus: 8
  min_train_gpus: 8
  min_rollout_gpus: 8
  rollout_node_tp_pattern: [1, 1, 2, 4]
  # Production planning waits for representative long-context observations and
  # requires a material predicted gain before changing the logical pool.
  plan_interval: 10
  warmup_steps: 20
  min_history_size: 20
  min_gain_ratio: 0.05
  reconfiguration_cost_s: 120.0
  # EHP must be driven by a versioned planner signal; no static target is used.
  runtime_training_pool_target_gpus: 0
  runtime_training_pool_plan_only: false
  # No policy maximum: the number of EHP replicas is derived from currently
  # available rollout capacity while retaining one complete rollout node.
  elastic_hybrid_max_workers: 0
  elastic_hybrid_replica_size_gpus: 8
  elastic_hybrid_min_rollout_gpus: 8
  elastic_hybrid_require_planner_signal: true
  elastic_hybrid_require_isolated_ccl: true
  elastic_hybrid_join_timeout_s: 180.0
  elastic_hybrid_signal_ttl_steps: 20
  elastic_hybrid_borrow_train_rollout_ratio: 1.15
  elastic_hybrid_release_train_rollout_ratio: 0.90
  elastic_hybrid_max_rollout_pressure: 0.80
  # Keep both experiment arms launch-capable.  The no-EHP arm never receives
  # a planner signal, so no worker can join; the EHP arm differs only by the
  # planner-controlled feature switch below.
  hybrid_training_prewarm_enabled: false
  hybrid_training_prewarm_count: 0
  hybrid_training_prewarm_worker_ids: []
  hybrid_worker_launch_enabled: true
  hybrid_worker_remote_control_enabled: true
  hybrid_worker_remote_control_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48_production/elastic_training_tasks"
  hybrid_worker_task_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48_production/elastic_training_tasks"
