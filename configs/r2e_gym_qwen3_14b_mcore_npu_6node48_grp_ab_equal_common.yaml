# Controlled six-node / 48-NPU GRP ablation. Both arms use the same model,
# workload, scheduler, and 100-step training configuration. The values below
# are the fixed control allocation and the seed state read by the cost model;
# the GRP arm replaces them with its unconstrained startup decision.
base_config: r2e_gym_qwen3_14b_mcore_npu_5node40_100step.yaml
hardware_config: hardware_config/ascend_910b3_64g.yaml

model_arch:
  num_params: 1.47683072e+10

# The first Torch Adam step lazily materializes optimizer state and briefly
# needs about 3 GiB more allocator headroom than model initialization alone.
# This value is calibrated from the observed TP4/DP1 Ascend OOM, not a GPU-count
# policy; any topology that fits the resulting memory model remains eligible.
profiling:
  train_workspace_bytes: 4.0e+9

train_gpus: 24
rollout_gpus: 24
num_nodes: 3
train_gpus_per_node: 8
rollout_gpus_per_node: 8
train_dp_size: 3

batch_size: 6
micro_batch_size: 1
n_samples: 1
total_steps: 100
seed: 42
sync_interval: 25
save_interval: 25
eval_interval: 0

max_concurrent_rollouts: 12
queue_size: 48

wandb_run_name: "r2e-gym-qwen3-14b-mcore-npu-6node48-grp-ab-equal"
history_experiment_name: "r2e_gym_qwen3_14b_6node48_grp_ab_equal"

heterogeneous_rollout:
  enabled: true
  total_gpus: 24
  instances:
    - {instance_id: "rollout_a_short_tp1_0", host: "node-a", tp: 1, gpus: [0], port: 8000}
    - {instance_id: "rollout_a_short_tp1_1", host: "node-a", tp: 1, gpus: [1], port: 8001}
    - {instance_id: "rollout_a_medium_tp2", host: "node-a", tp: 2, gpus: [2, 3], port: 8002}
    - {instance_id: "rollout_a_long_tp4", host: "node-a", tp: 4, gpus: [4, 5, 6, 7], port: 8003}
    - {instance_id: "rollout_b_short_tp1_0", host: "node-b", tp: 1, gpus: [0], port: 8000}
    - {instance_id: "rollout_b_short_tp1_1", host: "node-b", tp: 1, gpus: [1], port: 8001}
    - {instance_id: "rollout_b_medium_tp2", host: "node-b", tp: 2, gpus: [2, 3], port: 8002}
    - {instance_id: "rollout_b_long_tp4", host: "node-b", tp: 4, gpus: [4, 5, 6, 7], port: 8003}
    - {instance_id: "rollout_c_short_tp1_0", host: "node-c", tp: 1, gpus: [0], port: 8000}
    - {instance_id: "rollout_c_short_tp1_1", host: "node-c", tp: 1, gpus: [1], port: 8001}
    - {instance_id: "rollout_c_medium_tp2", host: "node-c", tp: 2, gpus: [2, 3], port: 8002}
    - {instance_id: "rollout_c_long_tp4", host: "node-c", tp: 4, gpus: [4, 5, 6, 7], port: 8003}
  scheduling:
    scheduler_type: "cmlfq"

global_resource_planner:
  allowed_train_tp: []
  allowed_train_pp: []
  micro_batch_sizes: []
  allowed_rollout_tp: [1, 2, 4, 8]
  require_heterogeneous_rollout_tp: false
  apply_to_runtime: false
  runtime_manage_rollout_processes: false
  runtime_reconfigure_training: false
  runtime_training_pool_only: false
  runtime_training_pool_target_gpus: 0
  runtime_training_pool_plan_only: true
  runtime_dynamic_reconfiguration_enabled: false
  decouple_communication_domains: false
  elastic_hybrid_planning_enabled: false
  hybrid_training_prewarm_enabled: false
  hybrid_training_prewarm_count: 0
  hybrid_training_prewarm_worker_ids: []
  hybrid_worker_launch_enabled: false
  hybrid_worker_remote_control_enabled: false
