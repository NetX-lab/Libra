# Matched control for the six-node C-MLFQ/heterogeneous rollout experiment.
# Training, R2E-Gym, GRP, EHP, rollout GPU count, endpoint count and generation
# limits are unchanged.  Only the rollout layout and scheduler differ:
# four TP2 replicas per rollout node with least-connections load balancing.
base_config: base.yaml
hardware_config: hardware_config/a100_80g.yaml
model_arch_config: model_arch_config/qwen3-14b.yaml

model_path: "/opt/libra/models/Qwen3-14B"
tokenizer_path: "/opt/libra/models/Qwen3-14B"
device_backend: "npu"
distributed_backend: "hccl"
rollout_backend: "vllm"
train_backend: "megatron_core"

train_gpus: 32
rollout_gpus: 16
num_nodes: 4
train_gpus_per_node: 8
rollout_gpus_per_node: 0
master_addr: "192.0.2.10"
master_port: 29742

train_tp_size: 8
train_pp_size: 1
train_cp_size: 1
train_dp_size: 4
train_ep_size: 1
expert_tensor_parallel_size: 1
sequence_parallel: true
use_distributed_optimizer: true
megatron_use_transformer_engine: false
megatron_recompute_num_layers: 1

batch_size: 4
micro_batch_size: 1
n_samples: 1
total_steps: 100
learning_rate: 1.0e-6
ppo_epochs: 1
sync_interval: 25
# The former 40-step run blocked rank 0 in a 30K-token asynchronous evaluator.
# Training rollouts still use 30K; final evaluation is launched separately.
eval_interval: 0
save_interval: 25

max_seq_length: 32768
max_new_tokens: 30000
r2e_max_turns: 12
r2e_max_prompt_tokens: 2048
r2e_stop_reward: 0.5
max_concurrent_rollouts: 8
max_head_offpolicyness: 2
queue_size: 32
temperature: 0.8
top_p: 0.95
recompute_logprobs: true

weight_sync_mode: "disk"
rollout_weight_sync_mode: "restart"
rollout_weight_sync_control_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/rollout_weight_sync"
rollout_weight_sync_timeout_s: 3600
rollout_weight_sync_export_only: true
require_rollout_weight_sync: true
sync_path: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/weights"
log_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/logs"
wandb_project: ""
wandb_run_name: "r2e-gym-qwen3-14b-mcore-npu-6node48-100step-homogeneous-lb"

enable_history_collection: true
history_output_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/history"
history_save_raw_lengths: true
history_flush_interval: 1
history_experiment_name: "r2e_gym_qwen3_14b_6node48_100step_homogeneous_lb"

heterogeneous_rollout:
  enabled: true
  total_gpus: 16
  vllm_host: "192.0.2.20"
  vllm_base_port: 8000
  max_model_len: 32768
  gpu_memory_utilization: 0.88
  instances:
    - {instance_id: "rollout_a_tp2_0", host: "192.0.2.20", tp: 2, gpus: [0, 1], port: 8000}
    - {instance_id: "rollout_a_tp2_1", host: "192.0.2.20", tp: 2, gpus: [2, 3], port: 8001}
    - {instance_id: "rollout_a_tp2_2", host: "192.0.2.20", tp: 2, gpus: [4, 5], port: 8002}
    - {instance_id: "rollout_a_tp2_3", host: "192.0.2.20", tp: 2, gpus: [6, 7], port: 8003}
    - {instance_id: "rollout_b_tp2_0", host: "192.0.2.21", tp: 2, gpus: [0, 1], port: 8000}
    - {instance_id: "rollout_b_tp2_1", host: "192.0.2.21", tp: 2, gpus: [2, 3], port: 8001}
    - {instance_id: "rollout_b_tp2_2", host: "192.0.2.21", tp: 2, gpus: [4, 5], port: 8002}
    - {instance_id: "rollout_b_tp2_3", host: "192.0.2.21", tp: 2, gpus: [6, 7], port: 8003}
  scheduling:
    scheduler_type: "load_balance"
    request_timeout: 3600
    load_balance_strategy: "least_connections"
    max_queue_length: 3
    enable_fallback: true
    cmlfq_rebuild_interval: 5
    cmlfq_tree_path: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/cmlfq_tree.json"
    cmlfq_tree_persist_interval: 1
    cmlfq_shared_load_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/cmlfq_shared_load"
    cmlfq_shared_load_ttl_s: 60
    cmlfq_shared_load_heartbeat_s: 10
    cmlfq_max_local_queue_length: 1
    cmlfq_payload_small_threshold: 1000
    cmlfq_payload_large_threshold: 12000
    cmlfq_buckets:
      short: {tp_degrees: [1], max_tokens: 4000}
      medium: {tp_degrees: [2], max_tokens: 12000}
      long: {tp_degrees: [4], max_tokens: 30000}

global_resource_planner:
  enabled: true
  train_backend: "analytic"
  rollout_backend: "analytic"
  plan_interval: 5
  warmup_steps: 0
  min_history_size: 4
  min_gain_ratio: 0.0
  reconfiguration_cost_s: 0.0
  allowed_train_tp: [8]
  allowed_train_pp: [1]
  initial_allocation_strategy: "grp"
  fixed_train_gpus: 0
  allocation_granularity_gpus: 8
  min_train_gpus: 8
  min_rollout_gpus: 8
  rollout_node_tp_pattern: [2, 2, 2, 2]
  allowed_rollout_tp: [2]
  require_heterogeneous_rollout_tp: false
  micro_batch_sizes: [1]
  # Keep the proven external vLLM endpoints stable while still executing GRP's
  # EHP training-pool decision. This avoids changing physical process IDs.
  apply_to_runtime: false
  runtime_async_planning: true
  runtime_dynamic_reconfiguration_enabled: true
  runtime_online_replanning: true
  # External rollout endpoints remain unchanged (apply_to_runtime=false), so a
  # cross-rank rollout drain would only stall already accepted requests and is
  # not required for the decoupled EHP training-domain update.
  runtime_drain_before_reconfigure: false
  runtime_peer_request_wait_s: 120
  runtime_manage_rollout_processes: false
  runtime_reconfigure_training: true
  runtime_training_pool_only: true
  runtime_training_pool_target_gpus: 33
  runtime_training_pool_plan_only: false
  decouple_communication_domains: true
  elastic_hybrid_max_workers: 0
  elastic_hybrid_replica_size_gpus: 8
  elastic_hybrid_min_rollout_gpus: 8
  hybrid_training_prewarm_enabled: true
  hybrid_training_prewarm_count: 1
  hybrid_training_prewarm_worker_ids: ["rollout0"]
  hybrid_worker_launch_enabled: true
  hybrid_worker_python: "/opt/libra/envs/rl_mindspeed/bin/python"
  hybrid_worker_task_dir: "/opt/libra/runs/r2e_gym_qwen3_14b_6node48/elastic_training_tasks"
  hybrid_worker_ready_timeout_s: 120
  gradient_transport_backend: "tcp"
  gradient_server_host: "0.0.0.0"
  gradient_server_public_host: "192.0.2.10"
  gradient_server_port: 29852
  gradient_server_authkey: "rl-framework-elastic"
  verbose: true
