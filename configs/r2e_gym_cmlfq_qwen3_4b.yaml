# R2E-Gym full Async RL post-training with C-MLFQ rollout scheduling.
base_config: base.yaml

hardware_config: hardware_config/a800_80g.yaml
model_arch_config: model_arch_config/qwen2.5-3b.yaml

model_path: "/path/to/Qwen3-4B"
tokenizer_path: "/path/to/Qwen3-4B"

train_gpus: 4
rollout_gpus: 8
tp_size: 1
train_tp_size: 1
train_pp_size: 1
train_dp_size: 4

batch_size: 16
micro_batch_size: 1
total_steps: 1000
learning_rate: 1.0e-6
ppo_epochs: 1
max_concurrent_rollouts: 16
max_head_offpolicyness: 4
queue_size: 256

max_new_tokens: 32768
max_seq_length: 32768
n_samples: 4
temperature: 0.8
top_p: 0.95

dataset_name: "r2e_gym_v1"
dataset_split: "train"

sync_path: "./logs/r2e_gym_cmlfq/qwen3_4b_weights"
log_dir: "./logs/r2e_gym_cmlfq"
wandb_project: "RL_Framework_R2E_Gym_CMLFQ"
wandb_run_name: "r2e-gym-qwen3-4b-cmlfq"
eval_interval: 100
save_interval: 100
keep_latest_checkpoints: 3

enable_history_collection: true
history_output_dir: "./logs/r2e_gym_cmlfq/history"
history_save_raw_lengths: false
history_flush_interval: 1
history_experiment_name: "r2e_gym_cmlfq"

global_resource_planner:
  enabled: true
  train_backend: "sailor"        # analytic | sailor
  rollout_backend: "vidur"       # analytic | vidur
  plan_interval: 20
  warmup_steps: 2
  min_history_size: 16
  min_gain_ratio: 0.05
  reconfiguration_cost_s: 15.0
  max_history_size: 4096
  allowed_rollout_tp: [1, 2, 4, 8]
  allowed_train_tp: [1, 2, 4]
  allowed_train_pp: [1, 2]
  micro_batch_sizes: [1, 2, 4]
  apply_to_runtime: true
  verbose: false
  simulator_allow_fallback: true
  simulator_timeout_s: 120.0
  simulator_cache_dir: "./logs/global_resource_planner/simulator_cache"
  sailor_path: "../sailor"
  sailor_python: "/path/to/rl_framework_env/bin/python"
  vidur_path: "../vidur"
  vidur_python: "/path/to/rl_framework_env/bin/python"
  sailor_train_command: >-
    {python} {rl_framework_path}/scripts/sailor_train_eval.py
    {input_json} {output_json}
    --sailor-path {sailor_path}
    --model-name OPT-350
    --gpu-type A100-40
    --gpus-per-node 4
  vidur_rollout_command: >-
    {python} {rl_framework_path}/scripts/vidur_rollout_eval.py
    {trace_csv} {output_json} {tp_list}
    --vidur-path {vidur_path}
    --python {python}
    --model-name meta-llama/Meta-Llama-3-8B
    --device a100
    --scheduler sarathi
    --batch-size-cap 512
    --chunk-size 512
    --max-tokens 32768
  runtime_manage_rollout_processes: false
  runtime_reconfigure_training: false
  hybrid_worker_launch_enabled: false
  hybrid_worker_python: "python"
  hybrid_worker_task_dir: "./logs/elastic_training_tasks"
  gradient_transport_backend: "tcp"  # tcp | native_rdma
  gradient_server_host: "127.0.0.1"
  gradient_server_port: 0
  gradient_server_authkey: "rl-framework-elastic"
  native_rdma_device: "mlx5_0"
  native_rdma_gid_index: 0
  native_rdma_ib_port: 1
  native_rdma_max_bytes: 67108864
  vllm_ready_timeout_s: 300.0
  vllm_stop_timeout_s: 30.0

heterogeneous_rollout:
  enabled: true
  total_gpus: 8
  vllm_host: "0.0.0.0"
  vllm_base_port: 8000
  max_model_len: 32768
  gpu_memory_utilization: 0.90

  instances:
    - instance_id: "long_tp4"
      tp: 4
      gpus: [0, 1, 2, 3]
    - instance_id: "short_tp2_0"
      tp: 2
      gpus: [0, 1]
    - instance_id: "short_tp2_1"
      tp: 2
      gpus: [2, 3]

  scheduling:
    scheduler_type: "cmlfq"
    load_balance_strategy: "least_connections"
    max_queue_length: 64
    enable_fallback: true
    cmlfq_rebuild_interval: 50
    cmlfq_tree_path: "./logs/r2e_gym_cmlfq/cmlfq_tree.json"
    cmlfq_payload_small_threshold: 400
    cmlfq_payload_large_threshold: 1600
    cmlfq_buckets:
      short:
        tp_degrees: [2]
        max_tokens: 3000
      medium:
        tp_degrees: [2]
        max_tokens: 6000
      long:
        tp_degrees: [4]
        max_tokens: 32768
