# Strict control arm: all training, rollout, optimizer, data, seed and planner
# settings come from the shared production base. Only EHP controls are off.
base_config: r2e_gym_qwen3_14b_mcore_gpu_6node48_production_base.yaml

wandb_run_name: "r2e-gym-qwen3-14b-mcore-gpu-6node48-production-no-ehp"
history_experiment_name: "r2e_gym_qwen3_14b_6node48_production_no_ehp"

global_resource_planner:
  elastic_hybrid_planning_enabled: false
  # GRP still owns startup placement through PreflightPlanner, but no runtime
  # decision may alter that placement in the 200-step control run.
  runtime_online_replanning: false
  runtime_dynamic_reconfiguration_enabled: false
  runtime_reconfigure_training: false
  hybrid_worker_launch_enabled: false
  hybrid_worker_remote_control_enabled: false
  elastic_hybrid_require_isolated_ccl: false
