# R2E-Gym on 64 training and 56 rollout 910B3 NPUs. The eight training
# nodes are fixed; vLLM uses 4+2+1 nodes so every expert-parallel group
# divides DeepSeek's expert count.
base_config: deepseek_v4_128_baseline.yaml
rollout_gpus: 56
n_total_gpus: 120
total_steps: 8
r2e_max_turns: 2
r2e_max_prompt_tokens: 1024
log_dir: /libra-work/benchmark_r2e_120_20261010/baseline/logs
phase_trace_dir: /libra-work/benchmark_r2e_120_20261010/baseline/phase_trace
sync_path: /libra-work/benchmark_r2e_120_20261010/baseline/checkpoints
heterogeneous_rollout:
  total_gpus: 56
  instances:
    - {instance_id: rollout_a, host: 192.168.0.217, tp: 8, port: 8010, gpus: [0, 1, 2, 3, 4, 5, 6, 7]}
    - {instance_id: rollout_b, host: 192.168.0.109, tp: 8, port: 8011, gpus: [0, 1, 2, 3, 4, 5, 6, 7]}
    - {instance_id: rollout_c, host: 192.168.0.192, tp: 8, port: 8012, gpus: [0, 1, 2, 3, 4, 5, 6, 7]}
