# Five physical Ascend nodes: four 8-NPU Megatron training nodes plus one
# 8-NPU heterogeneous rollout node. Training topology is TP=8, DP=4.
base_config: base.yaml
hardware_config: hardware_config/a100_80g.yaml
model_arch_config: model_arch_config/qwen3-14b.yaml

model_path: "./models/Qwen3-14B"
tokenizer_path: "./models/Qwen3-14B"
device_backend: "npu"
distributed_backend: "hccl"
rollout_backend: "vllm"
train_backend: "megatron_core"

train_gpus: 32
rollout_gpus: 8
num_nodes: 4
train_gpus_per_node: 8
rollout_gpus_per_node: 0
master_addr: "node-internal"
master_port: 29710

train_tp_size: 8
train_pp_size: 1
train_cp_size: 1
train_dp_size: 4
train_ep_size: 1
expert_tensor_parallel_size: 1
sequence_parallel: true
use_distributed_optimizer: true
megatron_use_transformer_engine: false
megatron_recompute_num_layers: 1

batch_size: 4
micro_batch_size: 1
n_samples: 1
total_steps: 100
learning_rate: 1.0e-6
ppo_epochs: 1
sync_interval: 25
eval_interval: 10
save_interval: 25

max_seq_length: 32768
max_new_tokens: 30000
r2e_max_turns: 12
r2e_max_prompt_tokens: 2048
r2e_stop_reward: 0.5
max_concurrent_rollouts: 4
max_head_offpolicyness: 2
queue_size: 16
temperature: 0.8
top_p: 0.95
recompute_logprobs: true

weight_sync_mode: "disk"
rollout_weight_sync_mode: "restart"
rollout_weight_sync_control_dir: "./runs/r2e_gym_qwen3_14b_5node40/rollout_weight_sync"
rollout_weight_sync_timeout_s: 3600
rollout_weight_sync_export_only: true
require_rollout_weight_sync: true
sync_path: "./runs/r2e_gym_qwen3_14b_5node40/weights"
log_dir: "./runs/r2e_gym_qwen3_14b_5node40/logs"
wandb_project: ""
wandb_run_name: "r2e-gym-qwen3-14b-mcore-npu-5node40-100step"

enable_history_collection: true
history_output_dir: "./runs/r2e_gym_qwen3_14b_5node40/history"
history_save_raw_lengths: true
history_flush_interval: 1
history_experiment_name: "r2e_gym_qwen3_14b_5node40_100step"

heterogeneous_rollout:
  enabled: true
  total_gpus: 8
  vllm_host: "node-internal"
  vllm_base_port: 8000
  max_model_len: 32768
  gpu_memory_utilization: 0.88
  instances:
    - instance_id: "short_tp1_0"
      tp: 1
      gpus: [0]
      port: 8000
    - instance_id: "short_tp1_1"
      tp: 1
      gpus: [1]
      port: 8001
    - instance_id: "medium_tp2"
      tp: 2
      gpus: [2, 3]
      port: 8002
    - instance_id: "long_tp4"
      tp: 4
      gpus: [4, 5, 6, 7]
      port: 8003
  scheduling:
    scheduler_type: "cmlfq"
    request_timeout: 3600
    load_balance_strategy: "least_connections"
    max_queue_length: 3
    enable_fallback: true
    cmlfq_rebuild_interval: 5
    cmlfq_tree_path: "./runs/r2e_gym_qwen3_14b_5node40/cmlfq_tree.json"
    cmlfq_tree_persist_interval: 1
    cmlfq_shared_load_dir: "./runs/r2e_gym_qwen3_14b_5node40/cmlfq_shared_load"
    cmlfq_shared_load_ttl_s: 60
    cmlfq_shared_load_heartbeat_s: 10
    cmlfq_max_local_queue_length: 1
    cmlfq_payload_small_threshold: 1000
    cmlfq_payload_large_threshold: 12000
    cmlfq_buckets:
      short:
        tp_degrees: [1]
        max_tokens: 4000
      medium:
        tp_degrees: [2]
        max_tokens: 12000
      long:
        tp_degrees: [4]
        max_tokens: 30000

global_resource_planner:
  enabled: true
  train_backend: "analytic"
  rollout_backend: "analytic"
  plan_interval: 5
  warmup_steps: 0
  min_history_size: 4
  min_gain_ratio: 0.0
  reconfiguration_cost_s: 0.0
  allowed_train_tp: [8]
  allowed_train_pp: [1]
  fixed_train_gpus: 32
  allowed_rollout_tp: [1, 2, 4]
  require_heterogeneous_rollout_tp: true
  micro_batch_sizes: [1]
  apply_to_runtime: true
  runtime_async_planning: true
  runtime_dynamic_reconfiguration_enabled: true
  runtime_online_replanning: true
  runtime_peer_request_wait_s: 10
  runtime_manage_rollout_processes: false
  runtime_reconfigure_training: true
  runtime_training_pool_only: true
  runtime_training_pool_target_gpus: 32
  runtime_training_pool_plan_only: false
  decouple_communication_domains: true
  hybrid_training_prewarm_enabled: true
  hybrid_training_prewarm_count: 1
  hybrid_training_prewarm_worker_ids: ["long_tp4"]
  hybrid_worker_launch_enabled: false
  gradient_transport_backend: "tcp"
  gradient_server_host: "0.0.0.0"
  gradient_server_public_host: "node-internal"
  gradient_server_port: 29720
  gradient_server_authkey: "rl-framework-elastic"
  verbose: true
