# Single-node Ascend pilot for R2E-Gym + Qwen3-14B + C-MLFQ.
#
# Resource layout on an 8x910B host after freeing the devices:
#   NPU 0-3: FSDP training, launched with torchrun
#   NPU 4:   rollout short_tp1_0
#   NPU 5:   rollout short_tp1_1
#   NPU 6-7: rollout long_tp2

base_config: base.yaml

hardware_config: hardware_config/a100_80g.yaml
model_arch_config: model_arch_config/qwen3-14b.yaml

model_path: "/path/to/Qwen3-14B"
tokenizer_path: "/path/to/Qwen3-14B"

device_backend: "npu"
distributed_backend: "hccl"
rollout_backend: "vllm"
train_backend: "fsdp"

train_gpus: 4
rollout_gpus: 4
tp_size: 1
train_tp_size: 1
train_pp_size: 1
train_dp_size: 4
vllm_tp_size: 1

batch_size: 4
micro_batch_size: 1
n_samples: 1
total_steps: 2
learning_rate: 1.0e-6
ppo_epochs: 1
sync_interval: 1
eval_interval: 1
save_interval: 0

max_seq_length: 1024
max_new_tokens: 64
max_concurrent_rollouts: 2
max_head_offpolicyness: 1
queue_size: 16
temperature: 0.8
top_p: 0.95
recompute_logprobs: true

weight_sync_mode: "disk"
rollout_weight_sync_mode: "restart"
rollout_weight_sync_control_dir: "./logs/r2e_gym_qwen3_14b_npu_pilot/rollout_weight_sync"
rollout_weight_sync_timeout_s: 2400
rollout_weight_sync_export_only: false
require_rollout_weight_sync: true

enable_history_collection: true
history_output_dir: "./logs/r2e_gym_qwen3_14b_npu_pilot/history"
history_save_raw_lengths: true
history_flush_interval: 1
history_experiment_name: "r2e_gym_qwen3_14b_npu_pilot"

log_dir: "./logs/r2e_gym_qwen3_14b_npu_pilot"
sync_path: "./logs/r2e_gym_qwen3_14b_npu_pilot/weights"
wandb_project: ""
wandb_run_name: "r2e-gym-qwen3-14b-npu-pilot"

heterogeneous_rollout:
  enabled: true
  total_gpus: 4
  vllm_host: "127.0.0.1"
  vllm_base_port: 8000
  max_model_len: 1024
  gpu_memory_utilization: 0.88

  instances:
    - instance_id: "short_tp1_0"
      tp: 1
      gpus: [4]
      port: 8000
    - instance_id: "short_tp1_1"
      tp: 1
      gpus: [5]
      port: 8001
    - instance_id: "long_tp2"
      tp: 2
      gpus: [6, 7]
      port: 8002

  scheduling:
    scheduler_type: "cmlfq"
    load_balance_strategy: "least_connections"
    max_queue_length: 8
    enable_fallback: true
    cmlfq_rebuild_interval: 4
    cmlfq_tree_path: "./logs/r2e_gym_qwen3_14b_npu_pilot/cmlfq_tree.json"
    cmlfq_tree_persist_interval: 1
    cmlfq_payload_small_threshold: 400
    cmlfq_payload_large_threshold: 1600
    cmlfq_buckets:
      short:
        tp_degrees: [1]
        max_tokens: 256
      medium:
        tp_degrees: [1]
        max_tokens: 768
      long:
        tp_degrees: [2]
        max_tokens: 1024

global_resource_planner:
  enabled: false
