# DeepSeek-V4-Flash 112-card GRP treatment: same topology and workload as baseline.
base_config: deepseek_v4_r2e_112_baseline.yaml
log_dir: /libra-work/benchmark_r2e_112_20261010/grp/logs
phase_trace_dir: /libra-work/benchmark_r2e_112_20261010/grp/phase_trace
sync_path: /libra-work/benchmark_r2e_112_20261010/grp/checkpoints
global_resource_planner:
  enabled: true
  initial_allocation_strategy: grp
  plan_interval: 5
  min_history_size: 1
  min_gain_ratio: 0.0
  allocation_granularity_gpus: 8
  min_train_gpus: 64
  min_rollout_gpus: 48
  allowed_train_tp: [8]
  allowed_train_pp: [2]
  allowed_rollout_tp: [8]
  apply_to_runtime: false
  runtime_async_planning: true
  runtime_online_replanning: true
  runtime_training_pool_only: true
