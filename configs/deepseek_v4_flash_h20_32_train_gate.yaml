megatron_optimizer_pin_cpu_grads: false
megatron_streaming_export: false
global_resource_planner:
  enabled: false
rollout_weight_sync_mode: none
sync_interval: 0
batch_size: 16
n_samples: 2
micro_batch_size: 1
recompute_micro_batch_size: 1
