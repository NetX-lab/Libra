model_path: deepseek-ai/DeepSeek-V4-Flash
hardware_config: hardware_config/h20_3e_141g.yaml
model_arch_config: model_arch_config/deepseek-v4-flash.yaml
train_backend: megatron_core
megatron_model_family: deepseek_v4
train_gpus: 32
rollout_gpus: 0
train_tp_size: 1
train_pp_size: 4
train_cp_size: 1
