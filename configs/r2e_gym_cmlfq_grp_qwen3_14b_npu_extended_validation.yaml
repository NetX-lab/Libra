# Extended safe-memory R2E-Gym capability run.
#
# Keep the FSDP sequence cap at 4096 (the 14B four-NPU job is already close
# to HBM capacity), while increasing the per-turn generation budget, maximum
# tool interactions, and training horizon.  The smaller prompt budget leaves
# room for the added tool turns within the same safe activation envelope.
base_config: r2e_gym_cmlfq_grp_qwen3_14b_npu_multiturn_validation.yaml

total_steps: 24
max_new_tokens: 640
r2e_max_turns: 7
r2e_max_prompt_tokens: 1024

sync_interval: 12
eval_interval: 12
max_concurrent_rollouts: 2
queue_size: 8

log_dir: "./runs/r2e_gym_qwen3_14b_npu_extended_validation/logs"
sync_path: "/data_nv2/r2e_gym_qwen3_14b_npu_extended_validation/weights"
rollout_weight_sync_control_dir: "/data_nv2/r2e_gym_qwen3_14b_npu_extended_validation/rollout_weight_sync"
history_output_dir: "./runs/r2e_gym_qwen3_14b_npu_extended_validation/history"
history_experiment_name: "r2e_gym_qwen3_14b_npu_extended_validation"
wandb_run_name: "r2e-gym-qwen3-14b-npu-extended-validation"

heterogeneous_rollout:
  scheduling:
    cmlfq_tree_path: "./runs/r2e_gym_qwen3_14b_npu_extended_validation/cmlfq_tree.json"
