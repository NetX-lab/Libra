name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test environment
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
      - name: Run CPU regression suite
        run: bash scripts/test_cpu_ci.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-tests-python-${{ matrix.python }}
          path: reports/cpu-tests.xml
          if-no-files-found: warn
          retention-days: 14

  ci-required:
    name: CI required
    if: always()
    needs: [cpu-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all CPU test jobs to pass
        env:
          RESULT: ${{ needs.cpu-tests.result }}
        run: test "$RESULT" = success
